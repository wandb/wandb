name: pre-commit

on:
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # To allow diffing against HEAD^1.
          #
          # For the pull_request trigger, this action checks out the PR's
          # "merge branch", which is a commit made by merging the PR branch into
          # its target. The first parent of this commit is the target branch
          # (main, in most cases).
          #
          # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#how-the-merge-branch-affects-your-workflow
          fetch-depth: 2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup and run prek hooks
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install prek
          prek run --stage pre-push --last-commit --skip go-generate-graphql
