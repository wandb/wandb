name: SDK CI (shadow)

on:
  pull_request:
  push:
    branches: [main, "release-*"]
  workflow_dispatch:
    inputs:
      windows:
        description: Run Windows tests
        type: boolean
        default: true
      server-tests:
        description: Run server tests (requires registry access)
        type: boolean
        default: false
      server-image:
        description: Current server image to test
        type: string
        default: us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare-linux-dependencies:
    name: Prepare dependencies · Linux
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-linux-dependencies
        id: dependencies
        with:
          lookup-only: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          version: "0.12.11"
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR }}
      - name: Install nox
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade nox pip
      - name: Prepare Python dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: |
          nox -s unit_test_dependencies --python 3.10 3.13
          du -sh "$UV_CACHE_DIR" >> "$GITHUB_STEP_SUMMARY"
      - name: Save dependency cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.dependencies.outputs.cache-path }}
          key: ${{ steps.dependencies.outputs.cache-key }}
      - name: Summarize cache lookup
        run: |
          echo "Linux dependency cache hit: ${{ steps.dependencies.outputs.cache-hit == 'true' }}" >> "$GITHUB_STEP_SUMMARY"

  build-linux-wheel:
    name: Build wheel · Linux x64
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-sdk-wheel
        with:
          artifact-name: linux-x64-wheel

  build-macos-wheel:
    name: Build wheel · macOS ARM64
    runs-on: macos-15-xlarge
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-sdk-wheel
        with:
          artifact-name: macos-arm64-wheel

  build-windows-wheel:
    name: Build wheel · Windows x64
    if: github.event_name == 'push' || inputs.windows == true || endsWith(github.head_ref, '-ci-win')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-sdk-wheel
        with:
          artifact-name: windows-x64-wheel

  code-check:
    name: Code checks
    needs: prepare-linux-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: ./.github/actions/restore-linux-dependencies
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install nox
        run: python -m pip install --upgrade nox pip
      - name: Check generated files
        run: |
          nox -vt proto-check
          nox -vs codegen-check
      - name: Check package import
        run: |
          uv venv .venv-deps
          source .venv-deps/bin/activate
          uv pip install .
          python -c 'import wandb'
      - name: Check binary size and import time
        run: |
          nox -s wandb-core-size-check
          nox -s wandb-import-time-check
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-check-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  unit-go:
    name: Unit tests · Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Run Go tests
        working-directory: core
        run: go test -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-go
          path: core/coverage.txt
          if-no-files-found: warn
          retention-days: 7

  unit-rust:
    name: Unit tests · Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            parquet-rust-wrapper/target
            xpu/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-tests-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('parquet-rust-wrapper/**', '!parquet-rust-wrapper/target/**', 'xpu/**', '!xpu/target/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-tests-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-tests-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}-
      - name: Test parquet-rust-wrapper
        working-directory: parquet-rust-wrapper
        run: cargo test --verbose
      - name: Test wandb-xpu
        working-directory: xpu
        run: cargo test --verbose
      - name: Check wandb-xpu proto tooling
        working-directory: xpu
        run: cargo check --features build-proto --bin build_proto

  unit-linux-3-10:
    name: Unit tests · Linux · Python 3.10
    needs: [build-linux-wheel, prepare-linux-dependencies]
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.10"
      runs-on: ubuntu-latest-8-cores
      wheel-artifact: linux-x64-wheel
      artifact-name: unit-linux-3-10

  unit-linux-3-13:
    name: Unit tests · Linux · Python 3.13
    needs: [build-linux-wheel, prepare-linux-dependencies]
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.13"
      runs-on: ubuntu-latest-8-cores
      wheel-artifact: linux-x64-wheel
      artifact-name: unit-linux-3-13

  unit-macos-3-10:
    name: Unit tests · macOS · Python 3.10
    needs: build-macos-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.10"
      runs-on: macos-15-xlarge
      wheel-artifact: macos-arm64-wheel
      artifact-name: unit-macos-3-10

  unit-macos-3-13:
    name: Unit tests · macOS · Python 3.13
    needs: build-macos-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.13"
      runs-on: macos-15-xlarge
      wheel-artifact: macos-arm64-wheel
      artifact-name: unit-macos-3-13

  unit-windows-3-10:
    name: Unit tests · Windows · Python 3.10
    if: github.event_name == 'push' || inputs.windows == true || endsWith(github.head_ref, '-ci-win')
    needs: build-windows-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.10"
      runs-on: windows-2022
      wheel-artifact: windows-x64-wheel
      artifact-name: unit-windows-3-10

  unit-windows-3-13:
    name: Unit tests · Windows · Python 3.13
    if: github.event_name == 'push' || inputs.windows == true || endsWith(github.head_ref, '-ci-win')
    needs: build-windows-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      python: "3.13"
      runs-on: windows-2022
      wheel-artifact: windows-x64-wheel
      artifact-name: unit-windows-3-13

  system-linux-3-10:
    name: System tests · Python 3.10
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.10"
          session: system_tests
          artifact-name: system-linux-3-10
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  system-linux-3-13:
    name: System tests · Python 3.13
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.13"
          session: system_tests
          artifact-name: system-linux-3-13
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  system-min-server-linux-3-13:
    name: System tests · Server 0.70 · Python 3.13
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.13"
          session: system_tests
          artifact-name: system-min-server-linux-3-13
          server-image: us-central1-docker.pkg.dev/wandb-client-cicd/images/local-testcontainer:0.70.0
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  notebook-linux-3-10:
    name: Notebooks · Python 3.10
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.10"
          session: notebook_tests
          artifact-name: notebook-linux-3-10
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  notebook-linux-3-13:
    name: Notebooks · Python 3.13
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.13"
          session: notebook_tests
          artifact-name: notebook-linux-3-13
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  functional-linux-3-13:
    name: Functional tests · Python 3.13
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.13"
          session: functional_tests
          artifact-name: functional-linux-3-13
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  experimental-linux-3-13:
    name: Experimental clients · Python 3.13
    needs: prepare-linux-dependencies
    if: >-
      (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-nox-tests
        with:
          python: "3.13"
          session: experimental_tests
          artifact-name: experimental-linux-3-13
          server-image: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
          gcp-project: ${{ secrets.GCP_REGISTRY_PROJECT_NAME }}
          gcp-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ secrets.GCP_REGISTRY_SA }}

  result:
    name: SDK CI
    if: always()
    needs:
      - prepare-linux-dependencies
      - build-linux-wheel
      - build-macos-wheel
      - build-windows-wheel
      - code-check
      - unit-go
      - unit-rust
      - unit-linux-3-10
      - unit-linux-3-13
      - unit-macos-3-10
      - unit-macos-3-13
      - unit-windows-3-10
      - unit-windows-3-13
      - system-linux-3-10
      - system-linux-3-13
      - system-min-server-linux-3-13
      - notebook-linux-3-10
      - notebook-linux-3-13
      - functional-linux-3-13
      - experimental-linux-3-13
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize jobs and check results
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESULTS: ${{ toJSON(needs) }}
          WINDOWS_ENABLED: ${{ github.event_name == 'push' || inputs.windows == true || endsWith(github.head_ref, '-ci-win') }}
          SERVER_TESTS_ENABLED: ${{ (vars.GHA_SHADOW_SERVER_TESTS == 'true' || inputs.server-tests == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const failures = Object.entries(results).filter(([name, job]) => {
              if (job.result === 'success') return false;
              if (job.result !== 'skipped') return true;
              if (name === 'build-windows-wheel' || name.startsWith('unit-windows-')) return process.env.WINDOWS_ENABLED === 'true';
              if (/^(system|notebook|functional|experimental)-/.test(name)) return process.env.SERVER_TESTS_ENABLED === 'true';
              return true;
            });
            if (failures.length) {
              core.setFailed(failures.map(([name, job]) => `${name}: ${job.result}`).join(', '));
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const rows = jobs.filter(job => job.name !== 'SDK CI').map(job => {
              const seconds = job.completed_at && job.started_at
                ? Math.max(0, Math.round((Date.parse(job.completed_at) - Date.parse(job.started_at)) / 1000))
                : null;
              return [
                `<a href="${job.html_url}">${job.name}</a>`,
                job.conclusion || job.status,
                seconds === null ? '' : `${Math.floor(seconds / 60)}m ${seconds % 60}s`,
              ];
            });
            core.summary.addHeading('SDK CI');
            core.summary.addTable([
              [{data: 'Job', header: true}, {data: 'Result', header: true}, {data: 'Duration', header: true}],
              ...rows,
            ]);
            core.summary.addRaw('\nJob durations include setup and tests. Unit test groups also wait for their platform wheel build; Linux tests and code checks wait for dependency preparation. Open a test job for failures and test counts.\n');
            if (process.env.SERVER_TESTS_ENABLED !== 'true') {
              core.summary.addRaw('\nServer tests were not exercised. They require registry access and the GHA_SHADOW_SERVER_TESTS variable or the manual server-tests option.\n');
            }
            if (process.env.WINDOWS_ENABLED !== 'true') {
              core.summary.addRaw('\nWindows tests run on main/release pushes, PR branches ending in -ci-win, or manual runs with Windows selected.\n');
            }
            await core.summary.write();
