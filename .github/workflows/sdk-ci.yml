name: SDK CI

on:
  pull_request:
  push:
    branches: [main, release-*]
  workflow_dispatch:
    inputs:
      windows:
        description: Run the Windows unit tests
        type: boolean
        default: true
      server-image:
        description: local-testcontainer image for the server tests (defaults to the master build)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVER_IMAGE: ${{ inputs.server-image || 'us-central1-docker.pkg.dev/wandb-production/images/local-testcontainer:master' }}
  MIN_SERVER_IMAGE: us-central1-docker.pkg.dev/wandb-client-cicd/images/local-testcontainer:0.70.0

jobs:
  build-wheel:
    name: Build wheel · ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [Linux, macOS]
        include:
          - os: Linux
            runs-on: ubuntu-latest-8-cores
          - os: macOS
            runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-wheel

  build-wheel-windows:
    name: Build wheel · Windows
    # Windows tests run on pushes, on branches named *-ci-win, and on request.
    if: github.event_name == 'push' || inputs.windows || endsWith(github.head_ref, '-ci-win')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-wheel

  unit-tests-linux:
    name: Unit tests · Linux
    needs: build-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      runs-on: ubuntu-latest-8-cores

  unit-tests-macos:
    name: Unit tests · macOS
    needs: build-wheel
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      runs-on: macos-15-xlarge

  unit-tests-windows:
    name: Unit tests · Windows
    needs: build-wheel-windows
    uses: ./.github/workflows/sdk-unit-tests.yml
    with:
      runs-on: windows-2022

  unit-tests-go:
    name: Unit tests · Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Run tests
        working-directory: core
        run: go test -count=1 -race -coverprofile=coverage.txt -covermode=atomic ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: unit-tests-go
          path: core/coverage.txt
          if-no-files-found: warn
          retention-days: 7

  unit-tests-rust:
    name: Unit tests · Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            parquet-rust-wrapper
            xpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test parquet-rust-wrapper
        working-directory: parquet-rust-wrapper
        run: cargo test --verbose
      - name: Test wandb-xpu
        working-directory: xpu
        run: |
          cargo test --verbose
          cargo check --features build-proto --bin build_proto

  code-check:
    name: Code checks
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The size check compares against the merge base with main.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.11"
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            parquet-rust-wrapper
            xpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nox
        run: python -m pip install nox
      - name: Check generated files
        run: |
          nox -vt proto-check
          nox -vs codegen-check
      - name: Check that the package imports
        run: |
          uv venv .venv-deps
          source .venv-deps/bin/activate
          uv pip install .
          python -c 'import wandb'
      - name: Compare binary sizes and import time with main
        run: |
          nox -s binary-size-check
          nox -s wandb-import-time-check

  system-tests:
    name: System tests · Python ${{ matrix.python }} · Server ${{ matrix.server }} · ${{ matrix.group }} of 8
    needs: build-wheel
    # Pulling the private server image needs this repository's GCP identity.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        server: [current, minimum]
        group: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - python: "3.10"
            server: minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_REGISTRY_SA }}
      - uses: ./.github/actions/run-tests
        with:
          session: system_tests
          python: ${{ matrix.python }}
          server-image: ${{ matrix.server == 'current' && env.SERVER_IMAGE || env.MIN_SERVER_IMAGE }}
          test-group: ${{ matrix.group }}
          test-groups: 8
          artifact-name: system-tests-${{ matrix.python }}-${{ matrix.server }}-${{ matrix.group }}

  server-tests:
    name: ${{ matrix.name }} · Python ${{ matrix.python }}
    needs: build-wheel
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Notebook tests, session: notebook_tests, python: "3.10" }
          - { name: Notebook tests, session: notebook_tests, python: "3.13" }
          - { name: Functional tests, session: functional_tests, python: "3.13" }
          - { name: Experimental client tests, session: experimental_tests, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_REGISTRY_SA }}
      - uses: ./.github/actions/run-tests
        with:
          session: ${{ matrix.session }}
          python: ${{ matrix.python }}
          server-image: ${{ env.SERVER_IMAGE }}
          artifact-name: ${{ matrix.session }}-${{ matrix.python }}

  result:
    name: SDK CI
    if: always()
    needs:
      - build-wheel
      - build-wheel-windows
      - unit-tests-linux
      - unit-tests-macos
      - unit-tests-windows
      - unit-tests-go
      - unit-tests-rust
      - code-check
      - system-tests
      - server-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
