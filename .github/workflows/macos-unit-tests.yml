name: macOS unit tests (GHA shadow)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-wheel:
    name: build-macos-arm64-wheel
    runs-on: macos-15-xlarge
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Match the development build that the unit-test nox session normally
      # produces from source.
      WANDB_BUILD_COVERAGE: "true"
      WANDB_BUILD_GORACEDETECT: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            parquet-rust-wrapper/target
            xpu/target
          key: macos-${{ runner.arch }}-cargo-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.arch }}-cargo-

      - name: Build wheel
        run: |
          python -m pip install --upgrade "uv!=0.10.5"
          started=$SECONDS
          uv build --wheel
          duration=$((SECONDS - started))
          echo "### macOS wheel build timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build command: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  unit-tests:
    name: unit-tests-macos-${{ matrix.python }}-shard-${{ matrix.shard }}
    # Build once on an xlarge runner, then fan tests out to the less expensive
    # standard ARM64 runners.
    needs: build-wheel
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        shard: [0, 1, 2, 3]
    env:
      # Preserve the four-way split used by CircleCI so shadow-run timings are
      # comparable. A follow-up migration can make these variable names
      # CI-provider-neutral.
      CIRCLE_NODE_INDEX: ${{ matrix.shard }}
      CIRCLE_NODE_TOTAL: 4
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Standard macOS runners have 7 GB of RAM, so avoid overcommitting them.
      WANDB_TEST_MAX_WORKERS: 4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Report runner resources
        run: |
          system_profiler SPHardwareDataType SPSoftwareDataType
          echo "Logical CPUs: $(sysctl -n hw.logicalcpu)"
          echo "Physical memory: $(sysctl -n hw.memsize) bytes"
          df -h /

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-arm64-wheel
          path: dist

      - name: Install system and test dependencies
        run: |
          # The hosted image includes this untrusted third-party tap. It is not
          # needed here, and Homebrew warns on every invocation while it exists.
          if brew tap | grep -qx aws/tap; then
            brew untap aws/tap
          fi
          brew install ffmpeg
          python -m pip install --upgrade nox pip "uv!=0.10.5"

      - name: Run unit tests
        run: |
          started=$SECONDS
          set +e
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel in dist, found ${#wheels[@]}" >&2
            exit 1
          fi
          export WANDB_TEST_WHEEL="${wheels[0]}"
          nox -s unit_tests --python "${{ matrix.python }}" --verbose
          status=$?
          duration=$((SECONDS - started))
          set -e

          {
            echo "### macOS unit test timing"
            echo "- Python: ${{ matrix.python }}"
            echo "- Shard: $(( ${{ matrix.shard }} + 1 ))/4"
            echo "- Test command: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-py${{ matrix.python }}-shard-${{ matrix.shard }}-results
          path: |
            test-results/
            cover-results/
          if-no-files-found: ignore
          retention-days: 7
