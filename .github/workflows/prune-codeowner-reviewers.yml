name: Prune Stale Code Owner Reviewers

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

env:
  # https://github.com/hmarr/codeowners/releases
  CODEOWNERS_VER: "1.2.1"

jobs:
  prune-stale-codeowner-reviewers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Checkout default branch CODEOWNERS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: codeowners-default
          fetch-depth: 1
          sparse-checkout: .github

      - name: cache codeowners
        id: codeowners
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/codeowners-bin
          key: "codeowners-${{ env.CODEOWNERS_VER }}"

      - name: download codeowners
        if: steps.codeowners.outputs.cache-hit != 'true'
        run: |-
          curl -sfSL https://github.com/hmarr/codeowners/releases/download/v${{ env.CODEOWNERS_VER }}/codeowners_${{ env.CODEOWNERS_VER }}_linux_amd64.tar.gz \
          | tar -xvz -C /tmp
          mv /tmp/codeowners /tmp/codeowners-bin

      - name: get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          write_output_files: true
          fetch_additional_submodule_history: true

      - name: get owners for files
        id: owners
        if: steps.changed-files.outputs.all_modified_files_count > 0
        run: |-
          xargs /tmp/codeowners-bin --file codeowners-default/.github/CODEOWNERS \
            < .github/outputs/all_changed_and_modified_files.txt \
            | tee codeowners_required.txt

      - name: Remove stale CODEOWNER review requests
        if: steps.owners.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const script = require('./.github/scripts/prune-codeowner-reviewers.js');
            await script({github, context, core});
