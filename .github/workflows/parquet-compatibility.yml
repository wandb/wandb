name: Parquet compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/parquet-compatibility.yml"
      - "core/go.mod"
      - "core/go.sum"
      - "core/internal/runhistoryreader/**"
      - "parquet-rust-wrapper/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/parquet-compatibility.yml"
      - "core/go.mod"
      - "core/go.sum"
      - "core/internal/runhistoryreader/**"
      - "parquet-rust-wrapper/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parquet-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  sdk-parquet-compatibility:
    name: SDK parquet compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check Rust format
        working-directory: parquet-rust-wrapper
        run: cargo fmt --all -- --check

      - name: Check Rust lints
        working-directory: parquet-rust-wrapper
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust parquet reader
        working-directory: parquet-rust-wrapper
        run: cargo test --locked

      - name: Build Rust parquet dynamic library
        working-directory: parquet-rust-wrapper
        run: cargo build --locked --release

      - name: Test Go history reader with Rust library
        working-directory: core
        env:
          WANDB_TEST_REQUIRE_RUST_ARROW_LIBRARY: "1"
          WANDB_TEST_RUST_ARROW_LIBRARY: ${{ github.workspace }}/parquet-rust-wrapper/target/release/libarrow_rs_wrapper.so
        run: go test -count=1 ./internal/runhistoryreader/...

      - name: Race-test Go history reader with Rust library
        working-directory: core
        env:
          WANDB_TEST_REQUIRE_RUST_ARROW_LIBRARY: "1"
          WANDB_TEST_RUST_ARROW_LIBRARY: ${{ github.workspace }}/parquet-rust-wrapper/target/release/libarrow_rs_wrapper.so
        run: go test -count=1 -race ./internal/runhistoryreader/...
