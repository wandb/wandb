name: Build wheel
description: Build the wandb wheel for this platform and upload it as the wheel-<OS> artifact.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.11"
        python-version: "3.13"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: core/go.mod
        # Keyed apart from the Go unit tests, which compile with different flags.
        cache-dependency-path: |
          core/go.sum
          hatch_build.py
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          parquet-rust-wrapper
          xpu
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build wheel
      shell: bash
      env:
        WANDB_BUILD_COVERAGE: ${{ runner.os != 'Windows' }}
        WANDB_BUILD_GORACEDETECT: ${{ runner.os != 'Windows' }}
        WANDB_BUILD_SKIP_WANDB_XPU: ${{ runner.os == 'Windows' }}
      run: uv build --wheel
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: wheel-${{ runner.os }}
        path: dist/*.whl
        if-no-files-found: error
        retention-days: 1
