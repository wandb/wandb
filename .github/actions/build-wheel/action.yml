name: Build wheel
description: >-
  Build a test wheel for this platform, with the Go race detector and Go coverage enabled
  except on Windows, and upload it as the wheel-Linux, wheel-macOS, or wheel-Windows
  artifact, named after runner.os. Release wheels are built by release-sdk.yml.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.4"
        python-version: "3.13"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: core/go.mod
        # Keyed apart from the Go unit tests, which compile with different flags.
        cache-dependency-path: |
          core/go.sum
          hatch_build.py
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: |
          parquet-rust-wrapper
          symon
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build wheel
      shell: bash
      env:
        # Linux already covers the race detector and Go coverage. Skipping them
        # and the wandb-symon binary keeps the Windows build short.
        WANDB_BUILD_COVERAGE: ${{ runner.os != 'Windows' }}
        WANDB_BUILD_GORACEDETECT: ${{ runner.os != 'Windows' }}
        WANDB_BUILD_SKIP_WANDB_SYMON: ${{ runner.os == 'Windows' }}
      run: uv build --wheel
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: wheel-${{ runner.os }}
        path: dist/*.whl
        if-no-files-found: error
        retention-days: 1
