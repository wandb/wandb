name: Run a CircleCI nox test job in shadow mode
description: Set up SDK toolchains and run one shard of a nox test session.

inputs:
  python:
    description: Python version
    required: true
  session:
    description: Nox session
    required: true
  shard:
    description: Zero-based shard index
    required: true
  shards:
    description: Total shard count
    required: true
  artifact-name:
    description: Name for the test-results artifact
    required: true
  server-image:
    description: Optional local-testcontainer image
    required: false
    default: ""
  install-dotnet:
    description: Whether to install .NET 9 for experimental client tests
    required: false
    default: "false"
  gcp-project:
    description: GCP project used to read the local-testcontainer image
    required: false
    default: ""
  gcp-provider:
    description: GCP workload identity provider
    required: false
    default: ""
  gcp-service-account:
    description: GCP service account
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: core/go.mod
        cache-dependency-path: core/go.sum

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Restore Cargo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/git/db
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          parquet-rust-wrapper/target
          xpu/target
        key: linux-${{ runner.arch }}-${{ inputs.session }}-cargo-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}
        restore-keys: |
          linux-${{ runner.arch }}-${{ inputs.session }}-cargo-

    - name: Install system and test dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg git libsndfile1
        python -m pip install --upgrade nox pip "uv!=0.10.5"

    - name: Install .NET 9
      if: inputs.install-dotnet == 'true'
      shell: bash
      run: |
        wget https://dot.net/v1/dotnet-install.sh -O "$RUNNER_TEMP/dotnet-install.sh"
        chmod +x "$RUNNER_TEMP/dotnet-install.sh"
        "$RUNNER_TEMP/dotnet-install.sh" --channel 9.0
        echo "$HOME/.dotnet" >> "$GITHUB_PATH"

    - name: Authenticate to Google Cloud
      if: inputs.server-image != ''
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        project_id: ${{ inputs.gcp-project }}
        workload_identity_provider: ${{ inputs.gcp-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Start local-testcontainer
      if: inputs.server-image != ''
      shell: bash
      env:
        SERVER_IMAGE: ${{ inputs.server-image }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        docker run --rm --detach \
          --name wandb-local-testcontainer \
          --env WANDB_ENABLE_TEST_CONTAINER=true \
          --publish 8080:8080 \
          --publish 9015:9015 \
          "$SERVER_IMAGE"
        python -m pip install click filelock pydantic requests
        python tools/local_wandb_server.py start \
          --hostname localhost \
          --base-port 8080 \
          --fixture-port 9015

    - name: Run nox session
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CIRCLE_NODE_INDEX: ${{ inputs.shard }}
        CIRCLE_NODE_TOTAL: ${{ inputs.shards }}
        NOX_SESSION: ${{ inputs.session }}
        PYTHON_VERSION: ${{ inputs.python }}
      run: |
        started=$SECONDS
        set +e
        nox -s "$NOX_SESSION" --python "$PYTHON_VERSION" --verbose
        status=$?
        duration=$((SECONDS - started))
        set -e

        {
          echo "### ${ARTIFACT_NAME} timing"
          echo "- Nox command: ${duration}s"
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$status"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}-results
        path: |
          test-results/
          cover-results/
          coverage.xml
          coverage.txt
        if-no-files-found: ignore
        retention-days: 7

    - name: Stop local-testcontainer
      if: always() && inputs.server-image != ''
      shell: bash
      run: docker rm --force wandb-local-testcontainer || true
