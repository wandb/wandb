name: Run SDK tests
description: Set up the toolchains, run a nox session, and save its results.

inputs:
  python:
    description: Python version
    required: true
  session:
    description: Nox session
    required: true
  artifact-name:
    description: Name for the test results
    required: true
  wheel-artifact:
    description: Optional prebuilt wheel artifact
    default: ""
  test-group:
    description: One-based test group
    default: ""
  test-groups:
    description: Total number of test groups
    default: ""
  server-image:
    description: Optional local-testcontainer image
    default: ""
  gcp-project:
    description: Google Cloud project
    default: ""
  gcp-provider:
    description: Workload identity provider
    default: ""
  gcp-service-account:
    description: Service account for reading the server image
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python }}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.11"
        enable-cache: ${{ runner.os == 'macOS' || inputs.wheel-artifact == '' }}
        save-cache: ${{ inputs.test-group == '' || inputs.test-group == '1' }}
        cache-local-path: ${{ runner.temp }}/setup-uv-cache
        cache-dependency-glob: requirements/requirements_dev.${{ inputs.python }}.*.txt
        cache-suffix: ${{ inputs.python }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: core/go.mod
        cache: ${{ inputs.wheel-artifact == '' }}
        cache-dependency-path: |
          core/go.sum
          .github/actions/build-sdk-wheel/action.yml
    - name: Install Rust
      if: inputs.wheel-artifact == ''
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - name: Restore Cargo cache
      if: inputs.wheel-artifact == ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
          parquet-rust-wrapper/target
          xpu/target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('parquet-rust-wrapper/Cargo.lock', 'xpu/Cargo.lock') }}-
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y ffmpeg libsndfile1
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
        brew install ffmpeg
        echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install -y ffmpeg
    - name: Install nox
      shell: bash
      run: python -m pip install --upgrade nox pip
    - name: Install .NET 9
      if: inputs.session == 'experimental_tests'
      shell: bash
      run: |
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
        bash "$RUNNER_TEMP/dotnet-install.sh" --channel 9.0
        echo "$HOME/.dotnet" >> "$GITHUB_PATH"
    - name: Download wheel
      if: inputs.wheel-artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ inputs.wheel-artifact }}
        path: dist
    - name: Authenticate to Google Cloud
      if: inputs.server-image != ''
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        project_id: ${{ inputs.gcp-project }}
        workload_identity_provider: ${{ inputs.gcp-provider }}
        service_account: ${{ inputs.gcp-service-account }}
    - name: Start local-testcontainer
      if: inputs.server-image != ''
      shell: bash
      env:
        SERVER_IMAGE: ${{ inputs.server-image }}
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        docker run --rm --detach \
          --name wandb-local-testcontainer \
          --env CI=1 \
          --env WANDB_ENABLE_TEST_CONTAINER=true \
          --publish 8080:8080 \
          --publish 9015:9015 \
          "$SERVER_IMAGE"
        python -m pip install click filelock pydantic requests
        python tools/local_wandb_server.py start \
          --hostname localhost \
          --base-port 8080 \
          --fixture-port 9015
    - name: Run tests
      shell: bash
      env:
        NOX_SESSION: ${{ inputs.session }}
        PYTHON_VERSION: ${{ inputs.python }}
        WHEEL_ARTIFACT: ${{ inputs.wheel-artifact }}
        WANDB_TEST_GROUP: ${{ inputs.test-group }}
        WANDB_TEST_GROUPS: ${{ inputs.test-groups }}
        WANDB_TEST_MAX_WORKERS: ${{ runner.os == 'Windows' && '4' || '8' }}
      run: |
        if [[ -n "$WHEEL_ARTIFACT" ]]; then
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          export WANDB_TEST_WHEEL="${wheels[0]}"
        fi
        started=$SECONDS
        status=0
        nox -s "$NOX_SESSION" --python "$PYTHON_VERSION" --verbose || status=$?
        echo "Nox session: $((SECONDS - started)) seconds, including package installation." >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Summarize test results
      if: always()
      shell: bash
      run: python .github/scripts/summarize_test_results.py
    - name: Save server logs
      if: always() && inputs.server-image != ''
      shell: bash
      run: |
        mkdir -p test-results
        docker logs wandb-local-testcontainer > test-results/server.log 2>&1 || true
        docker inspect wandb-local-testcontainer > test-results/server-state.json 2>&1 || true
    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          test-results/
          coverage.xml
          coverage.txt
        if-no-files-found: warn
        retention-days: 7
    - name: Stop local-testcontainer
      if: always() && inputs.server-image != ''
      shell: bash
      run: docker rm --force wandb-local-testcontainer || true
