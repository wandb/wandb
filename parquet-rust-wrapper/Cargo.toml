[package]
name = "arrow-rs-wrapper"
version = "0.1.1"
edition = "2021"

[dependencies]
parquet = { version = "59.1.0", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
    "flate2-zlib-rs",
    "lz4",
    "simdutf8",
] }
arrow = { version = "59.1.0", default-features = false }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "rustls",
] }
bytes = "1.11"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
crate-type = ["cdylib", "rlib"] # rlib needed for integration tests

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
