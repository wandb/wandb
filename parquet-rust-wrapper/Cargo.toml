[package]
name = "arrow-rs-wrapper"
version = "0.1.1"
edition = "2021"

[dependencies]
parquet = "59.1.0"
arrow = { version = "59.1.0" }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
crate-type = ["cdylib", "rlib"] # rlib needed for integration tests

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
