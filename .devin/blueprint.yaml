# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  # Install the Go version declared in core/go.mod (needed to build wandb-core).
  GO_VERSION=$(awk '$1 == "go" {print $2}' core/go.mod)
  if ! /usr/local/go/bin/go version 2>/dev/null | grep -q "go${GO_VERSION}"; then
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
    sudo rm -rf /usr/local/go
    sudo tar -C /usr/local -xzf /tmp/go.tgz
    rm -f /tmp/go.tgz
  fi
  echo "PATH=/usr/local/go/bin:$PATH" >> $ENVRC

  # The parquet-rust-wrapper's locked dependencies require rustc >= 1.86 and
  # xpu/Cargo.toml asks for 1.88, so track stable like CI's install_rust does.
  rustup toolchain install stable --profile minimal
  rustup default stable

  # `prek` is the pre-commit runner used by this repo (CONTRIBUTING.md).
  uv tool install prek
  echo "PATH=$HOME/.local/bin:$PATH" >> $ENVRC
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  # Build wandb-core (Go) but skip the optional Rust-based wandb-xpu/orjson extensions.
  export WANDB_BUILD_SKIP_WANDB_XPU=true
  export WANDB_BUILD_SKIP_ORJSON=true
  # $ENVRC PATH entries can be clobbered by later blueprints, so don't rely on
  # the ones `initialize` writes for Go and prek.
  export PATH=/usr/local/go/bin:$HOME/.local/bin:$PATH
  # Pin the interpreter: the dev requirements don't resolve on 3.14 (no
  # TensorFlow cp314 wheel), and uv otherwise picks the newest it finds.
  uv venv --python 3.12
  uv pip install -r requirements/requirements_dev.txt
  uv pip install -r requirements/requirements_test.txt
  uv pip install -e .
  prek install
knowledge:
  - name: lint
    contents: |
      prek run ruff-check --all-files --hook-stage pre-push
      prek run ruff-format --all-files --hook-stage pre-push
  - name: test
    contents: |
      .venv/bin/python -m pytest tests/unit_tests/test_lib/ -x --timeout=60 -q
  - name: notes
    contents: |
      # The .venv created by `uv venv` has wandb installed editable plus
      # dev/test deps. Activate with `source .venv/bin/activate` or call
      # `.venv/bin/python` directly.
      #
      # WANDB_BUILD_SKIP_WANDB_XPU=true skips the optional GPU-monitoring
      # binary; WANDB_BUILD_SKIP_ORJSON=true skips the vendored orjson Rust
      # build. Neither is required for the verified lint/test commands.
