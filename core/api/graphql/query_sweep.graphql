query SweepConfig(
    $entity: String!,
    $project: String!,
    $sweep: String!,
) {
    project(name: $project, entityName: $entity) {
        sweep(sweepName: $sweep) {
            id
            state
            config
            displayName
            controllerRunName
        }
    }
}

# The per-run result both run queries read, for different sets of runs.
fragment SweepRunResult on Run {
    id
    name
    state
    config
    summaryMetrics
}

# Warm start replays prior runs from their final result alone, so it
# must not select sampledHistory: an empty spec list would not spare
# the backend, which still resolves the field once per run.
fragment SweepPriorRunsPage on RunConnection {
    pageInfo {
        hasNextPage
        endCursor
    }
    edges {
        node {
            ...SweepRunResult
        }
    }
}

query SweepPriorRuns(
    $entity: String!,
    $project: String!,
    $sweep: String!,
    $first: Int!,
    $cursor: String,
) {
    project(name: $project, entityName: $entity) {
        sweep(sweepName: $sweep) {
            state
            runs(first: $first, after: $cursor) {
                ...SweepPriorRunsPage
            }
        }
    }
}

# The poll path also samples history: early stopping reads the
# in-flight runs' curves, not just their summaries.
fragment SweepPollRuns on RunConnection {
    pageInfo {
        hasNextPage
        endCursor
    }
    edges {
        node {
            ...SweepRunResult
            sampledHistory(specs: $historySpecs)
        }
    }
}

# Fetches the sweep's state together with just the runs the scheduler is
# still watching, selected by name; the whole sweep is far larger.
query SweepWatchedRuns(
    $entity: String!,
    $project: String!,
    $sweep: String!,
    $filters: JSONString!,
    $first: Int!,
    $cursor: String,
    $historySpecs: [JSONString!]!,
) {
    project(name: $project, entityName: $entity) {
        sweep(sweepName: $sweep) {
            state
        }
        runs(filters: $filters, first: $first, after: $cursor) {
            ...SweepPollRuns
        }
    }
}

# Confirms a tracked run still exists before it is reaped as deleted.
# The run listing lags writes; this read is strongly consistent.
query RunState(
    $entity: String!,
    $project: String!,
    $run: String!,
) {
    project(name: $project, entityName: $entity) {
        run(name: $run) {
            id
            state
        }
    }
}
