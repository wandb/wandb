query QueryProjectRuns(
    $entity: String!,
    $project: String!,
    $first: Int,
    $order: String,
    $cursor: String,
) {
    project(name: $project, entityName: $entity) {
        runs(first: $first, order: $order, after: $cursor) {
            edges {
                node {
                    ...LeetRun
                }
            }
            pageInfo {
                endCursor
                hasNextPage
            }
        }
    }
}
