syntax = "proto3";

package wandb.filestream.v1;

option go_package = "core/pkg/filestream_proto/v1;filestreamv1";

/*
 * Wire schema for typed filestream uploads.
 *
 * The SDK sends a FileStreamUpload as the body of `POST .../file_stream`
 * with the content type `application/vnd.wandb.filestream.v1+protobuf`.
 * The JSON body on the same route, content type `application/json`,
 * stays supported. The SDK sends the protobuf body only when the server
 * reports the matching ServerFeature flag. If the server rejects the
 * body, the SDK re-sends the chunk as JSON.
 *
 * This file is the source of truth. wandb/core mirrors it, and a CI
 * check compares the compiled descriptors.
 *
 * Compatibility rules:
 *   - Field numbers are frozen. Never renumber or reuse them.
 *   - A change that adds a field keeps the content type
 *     `application/vnd.wandb.filestream.v1+protobuf`. The SDK sends the
 *     new field only when a ServerFeature flag is on.
 *   - A change that alters how the server reads an existing field
 *     requires a new content type version, for example
 *     `application/vnd.wandb.filestream.v2+protobuf`. A new version is a
 *     new proto package and a new file, `wandb.filestream.v2` in
 *     `wandb_filestream_v2.proto`, so that a server can decode both
 *     versions in one binary. The content type and the package always
 *     change together.
 *   - Kinds are frozen. The server rejects an unknown kind.
 *   - The messages must stay free of map fields. This keeps the encoding
 *     deterministic, so the server can byte-compare a re-encode.
 */

// FileStreamUpload is one filestream request.
//
// It is the protobuf form of the JSON request body. Every field except
// `history` has the same meaning as its JSON counterpart.
message FileStreamUpload {
  // Line-oriented file updates: events, summary, and console output.
  //
  // A request may also send history here as JSON lines, but not in the
  // same request as `history`.
  repeated FileStreamChunk files = 1;

  // Typed history rows. Replaces the "wandb-history.jsonl" entry in `files`.
  MetricsBatchChunk history = 2;

  // Names of files that finished uploading.
  repeated string uploaded = 3;

  // The run is about to be preempted and will not send heartbeats for
  // a while. It is not dead.
  optional bool preempting = 4;

  // The run finished.
  optional bool complete = 5;

  // The exit code of the run's script. Only meaningful when `complete` is set.
  optional int32 exitcode = 6;
}

// FileStreamChunk appends or overwrites lines in one filestream file.
message FileStreamChunk {
  // The filestream file name, for example "wandb-events.jsonl".
  //
  // A request must not repeat a name.
  string name = 1;

  // The line number of the first line in `content`.
  int64 offset = 2;

  // The lines to write, in order. Each line is a complete JSON object,
  // or a line of console output.
  repeated string content = 3;
}

// MetricsBatchChunk appends typed history rows at a line offset.
//
// Each row counts as one history line. The server must count rows in
// the same counter it reports as `historyLineCount`, so that a run can
// mix typed and JSON-lines requests and resume from either. The `_step`
// of each row is in the batch's sequence column, so `seq_key` is empty
// or "_step".
message MetricsBatchChunk {
  // The history line number of the first row in `batch`.
  int64 offset = 1;

  MetricsBatch batch = 2;
}

// MetricsBatch is a columnar set of metric rows.
//
// Keys are dictionary-encoded once per batch. Cells are stored in row
// order as (key id, kind) coordinates, and payloads are packed into one
// array per kind. Metric names are data, not schema, so a fixed message
// carries arbitrary keys. One metric, named by `seq_key`, is a dense
// per-row column instead of a cell. For history it is `_step`.
//
// Example:
//
//   rows:
//     {"_step": 0, "loss": 0.5}
//     {"_step": 1, "loss": NaN, "note": "spike"}
//     {"_step": 2, "big": 9007199254740993}
//
//   batch:
//     keys:       ["loss", "note", "big"]
//     row_ends:   [1, 3, 4]
//     cell_keys:  [0, 0, 1, 2]
//     cell_kinds: [FLOAT, FLOAT, STRING, INT]
//     floats:     [0.5, NaN]
//     ints:       [9007199254740993]
//     strings:    ["spike"]
//     seqs:       [0, 1, 2]
//     has_seq:    [1, 1, 1]
//     seq_key:    ""            (empty means "_step")
//
// This layout matches the server's internal batch field for field, but
// the two schemas are independent and evolve separately.
//
// A decoder must reject a batch when any of these conditions is false:
//   - `row_ends` is non-decreasing, and its last entry equals the cell count.
//   - `cell_keys` has one entry per cell, and every entry indexes into `keys`.
//   - `cell_kinds` has one entry per cell, and every entry is a known Kind.
//   - Each payload array has exactly as many entries as there are cells
//     of its kind.
//   - `keys` are unique and non-empty, and no row repeats a key.
//   - `seqs` and `has_seq` are both empty, or both have one entry per row.
//   - `seq_key` is empty or a key the route supports.
// The cell count is the length of `cell_kinds`.
message MetricsBatch {
  // Kind is the type tag of one cell. It selects the payload array.
  //
  // Integer and float are separate kinds, so an int64 above 2^53 keeps
  // its exact value. Nested objects and arrays stay as verbatim JSON
  // text, because no ingest consumer reads inside them.
  //
  // Values match `HistoryValue.Kind` in the transaction log, so the
  // map between the two is the identity. This is a convenience, not a
  // requirement.
  enum Kind {
    // Invalid. A decoder rejects it. A zero byte in `cell_kinds` is a
    // producer bug.
    KIND_UNSPECIFIED = 0;

    // JSON null. No payload.
    KIND_NULL = 1;

    // Payload in `bools`.
    KIND_BOOL = 2;

    // Payload in `ints`. Exact int64.
    KIND_INT = 3;

    // Payload in `floats`. NaN, Infinity and -Infinity are ordinary IEEE
    // values, not sentinel strings.
    KIND_FLOAT = 4;

    // Payload in `strings`.
    KIND_STRING = 5;

    // Payload in `jsons`. Verbatim JSON text for an object or an array.
    KIND_JSON = 6;
  }

  // The key dictionary. `cell_keys` index into it.
  //
  // Keys are top-level metric names. A nested value is one KIND_JSON
  // cell under its top-level key. The sequence key (`seq_key`) is not in
  // `keys`. It has its own column, `seqs`.
  repeated string keys = 1;

  // row_ends[i] is the cumulative cell count through row i, so row i
  // spans cells [row_ends[i-1], row_ends[i]). The row count is the
  // length of this array. A row may have zero cells.
  repeated uint32 row_ends = 2;

  // The key id of each cell, in row order.
  repeated uint32 cell_keys = 3;

  // The Kind of each cell, in row order. One byte per cell.
  bytes cell_kinds = 4;

  // Payload arrays. The cells of one kind take payloads from that kind's
  // array in cell order. A KIND_NULL cell has no payload.
  repeated double floats = 5;
  repeated sint64 ints = 6;
  repeated bool bools = 7;
  repeated string strings = 8;
  repeated string jsons = 9;

  // Dense sequence column: empty, or one entry per row. `has_seq` holds
  // one presence byte per row, because 0 is a valid sequence value and
  // presence needs its own encoding. A row with presence 0 has no
  // sequence value, and the server assigns one.
  //
  // This is a dense column because every consumer reads it, and the
  // server rewrites it for shared-mode runs.
  repeated sint64 seqs = 10;
  bytes has_seq = 11;

  // The metric key the sequence column represents: "_step" for history
  // (the default when empty), "_timestamp" for events, "_offset" for
  // logs. All are int64.
  string seq_key = 12;
}
