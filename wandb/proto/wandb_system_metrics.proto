// =============================================================================
// Runtime metrics that are not per device
// =============================================================================

// libtpu distributions and queues on the host.
message TpuRuntimeMetrics {
  enum DistributionKind {
    DISTRIBUTION_UNSPECIFIED = 0;
    BUFFER_TRANSFER_LATENCY = 1 [(distribution) = {
      unit: "s",
      display: "Buffer Transfer Latency",
      names: [ { name: "com.google.tpu.dcn_transfer.duration" } ]
    }];
    INBOUND_BUFFER_TRANSFER_LATENCY = 2 [(distribution) = {
      unit: "s",
      display: "Inbound Buffer Transfer Latency",
      names: [ { name: "com.google.tpu.dcn_inbound_transfer.duration" } ]
    }];
    HOST_TO_DEVICE_TRANSFER_LATENCY = 3 [(distribution) = {
      unit: "s",
      display: "Host to Device Transfer Latency",
      names: [ { name: "com.google.tpu.host_to_device_transfer.duration" } ]
    }];
    DEVICE_TO_HOST_TRANSFER_LATENCY = 4 [(distribution) = {
      unit: "s",
      display: "Device to Host Transfer Latency",
      names: [ { name: "com.google.tpu.device_to_host_transfer.duration" } ]
    }];
    COLLECTIVE_E2E_LATENCY = 5 [(distribution) = {
      unit: "s",
      display: "Collective End-to-End Latency",
      names: [ { name: "com.google.tpu.collective.duration" } ]
    }];
    HOST_COMPUTE_LATENCY = 6 [(distribution) = {
      unit: "s",
      display: "Host Compute Latency",
      names: [ { name: "com.google.tpu.host_compute.duration" } ]
    }];
    HLO_EXEC_TIMING = 7 [(distribution) = {
      unit: "s",
      display: "HLO Execution Time",
      names: [ { name: "com.google.tpu.hlo.execution.duration" } ]
    }];
    GRPC_TCP_MIN_RTT = 8 [(distribution) = {
      unit: "s",
      display: "gRPC TCP Minimum RTT",
      names: [ { name: "com.google.tpu.grpc.tcp.min_rtt" } ]
    }];
    GRPC_TCP_DELIVERY_RATE = 9 [(distribution) = {
      unit: "bit/s",
      display: "gRPC TCP Delivery Rate",
      names: [ { name: "com.google.tpu.grpc.tcp.delivery_rate" } ]
    }];
  }

  // In the kind's unit. Legacy keys are in microseconds and megabits per
  // second: tpu.<kind>[.<label>].<stat><unit>, such as
  // tpu.hloExecTiming.program_main.p50Us.
  message Distribution {
    DistributionKind kind = 1;
    // The program, buffer class or series. Empty for the libtpu SDK's flat
    // distributions, whose legacy keys have no label segment.
    string label = 2 [(attribute) = "com.google.tpu.label"];
    optional double mean = 3;
    optional double p50 = 4;
    optional double p90 = 5;
    optional double p95 = 6;
    optional double p99 = 7;
    optional double p999 = 8;
  }
  repeated Distribution distributions = 1;

  message QueueSize {
    string label = 1 [(attribute) = "com.google.tpu.label"];
    optional double size = 2 [(metric) = {
      unit: "{program}",
      display: "HLO Queue Size",
      names: [ { name: "com.google.tpu.hlo.queue.size" } ],
      legacy: [ { template: "tpu.hloQueueSize.{label}" } ]
    }];
  }
  repeated QueueSize hlo_queue_sizes = 2;
}

