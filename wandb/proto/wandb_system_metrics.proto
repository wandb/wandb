// =============================================================================
// Accelerator runtime metrics that are not per device
// =============================================================================

// libtpu host-level distributions and queues (wandb-xpu).
message TpuRuntimeMetrics {
  enum DistributionKind {
    DISTRIBUTION_UNSPECIFIED = 0;
    BUFFER_TRANSFER_LATENCY = 1;
    INBOUND_BUFFER_TRANSFER_LATENCY = 2;
    HOST_TO_DEVICE_TRANSFER_LATENCY = 3;
    DEVICE_TO_HOST_TRANSFER_LATENCY = 4;
    COLLECTIVE_E2E_LATENCY = 5;
    HOST_COMPUTE_LATENCY = 6;
    GRPC_TCP_MIN_RTT = 7;
    GRPC_TCP_DELIVERY_RATE = 8;
    HLO_EXEC_TIMING = 9;
  }

  // Legacy keys: tpu.<name>.<label>.<stat><Unit> for labeled kinds,
  // tpu.<name>.<stat><Unit> for flat ones; <stat> in mean, p50, p90, p95, p99,
  // p999; <Unit> is "Us" for latencies and "Mbps" for the delivery rate.
  message Distribution {
    DistributionKind kind = 1;
    // Program name for HLO_EXEC_TIMING, buffer class for transfer latencies,
    // empty for flat distributions.
    string label = 2;
    optional double mean = 3;
    optional double p50 = 4;
    optional double p90 = 5;
    optional double p95 = 6;
    optional double p99 = 7;
    optional double p999 = 8;
    // Full histogram when the gRPC backend answered (the SDK backend gives
    // percentiles only). Typed path only; today the buckets are interpolated
    // into percentiles and discarded.
    optional uint64 count = 9;
    optional double sum = 10;
    repeated double bucket_bounds = 11;
    repeated uint64 bucket_counts = 12;
  }
  // Which backend answered decides the stat set and, today, the key shape
  // (flat distributions gain a label segment on gRPC). The typed record
  // carries the label as a field, so the shape difference disappears.
  repeated Distribution distributions = 1;

  // Legacy key: tpu.hloQueueSize.<label>.
  message QueueSize {
    string label = 1;
    optional double size = 2 [(metric) = {
      unit: "1",
      display: "HLO Queue Size",
      legacy: [ { template: "tpu.hloQueueSize.{label}" } ]
    }];
  }
  repeated QueueSize hlo_queue_size = 2;
}

