// =============================================================================
// Metrics the schema does not model
// =============================================================================

// A gauge or counter scraped from an OpenMetrics endpoint
// (x_stats_open_metrics_endpoints).
message GenericMetric {
  // The endpoint's name in x_stats_open_metrics_endpoints.
  string source = 1;
  // The metric family name.
  string name = 2;
  repeated MetricLabel labels = 3;
  MetricInfo.Kind kind = 4;
  optional double value = 5 [(metric) = { legacy: [ { template: "openmetrics.{source}.{name}.{series}" } ] }];
  // The label set's position among the label sets of this metric in the
  // order symon first saw them. The {series} in the legacy key.
  uint32 series = 6;
}

message MetricLabel {
  string key = 1;
  string value = 2;
}
